name: Shell Compatibility Matrix

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-shell-versions:
    name: GNOME ${{ matrix.gnome-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gnome-version: '45'
            image: 'ghcr.io/schneegans/gnome-shell-pod-39:v19@sha256:66cb854935052ff4a09b6d9015ac71366cc19f5742321c8b4d3a6541a8af6834'
          - gnome-version: '46'
            image: 'ghcr.io/schneegans/gnome-shell-pod-40:v19@sha256:0267225aeb9ae0d87df3364e0a3b02ba6613bda8cd17a187a836d4a270ab820c'
          - gnome-version: '47'
            image: 'ghcr.io/schneegans/gnome-shell-pod-41:v19@sha256:ca22704775d903e5b6d03a2fbbe83913c0851df5d516b317640752be386433d6'
          - gnome-version: '48'
            image: 'ghcr.io/schneegans/gnome-shell-pod-rawhide:latest@sha256:76f67893e5ab9f9217de4c6ea31e065099d8ef7d81134e70a7910b8161de08c8'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip gettext podman

      - name: Install Node dependencies
        run: npm ci

      - name: Build extension package
        run: npm run build:package

      - name: Run E2E Smoke Test in GNOME ${{ matrix.gnome-version }} Container
        run: |
          UUID="extensions-sync@richardnpaul.github.com"
          ZIP="dist/${UUID}.zip"

          echo "Starting container for GNOME ${{ matrix.gnome-version }}..."
          # DAC_READ_SEARCH is required by the Fedora 40/41 based images: PAM's unix_chkpwd
          # must be able to read /etc/shadow (mode 000) for the gnomeshell autologin to
          # succeed. Without it user@1000.service never starts and the user bus never appears.
          POD=$(podman run --rm --cap-add=SYS_NICE --cap-add=IPC_LOCK --cap-add=CAP_SYS_ADMIN --cap-add=DAC_READ_SEARCH -td ${{ matrix.image }})
          podman exec --user root "${POD}" chmod 0644 /etc/shadow

          run_in_pod() {
            podman exec --user gnomeshell --workdir /home/gnomeshell "${POD}" set-env.sh "$@"
          }

          echo "=== Container runtime ==="
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}} runtime={{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}} kernel={{.Host.Kernel}}' || true

          echo "Waiting for user session bus..."
          sleep 3
          if ! timeout 60 podman exec --user gnomeshell --workdir /home/gnomeshell "${POD}" set-env.sh wait-user-bus.sh; then
            echo "ERROR: user session bus did not become available within 60s"
            echo "=== System state ==="
            podman exec "${POD}" systemctl is-system-running || true
            podman exec "${POD}" systemctl --failed --no-pager || true
            echo "=== User manager ==="
            podman exec "${POD}" systemctl status user@1000.service --no-pager || true
            podman exec "${POD}" loginctl list-sessions --no-pager || true
            echo "=== Container capabilities / shadow permissions ==="
            podman exec "${POD}" grep -E 'Cap(Eff|Bnd)|NoNewPrivs|Seccomp' /proc/1/status || true
            podman exec "${POD}" ls -l /etc/shadow /usr/sbin/unix_chkpwd || true
            echo "=== Login journal ==="
            podman exec "${POD}" journalctl -b --no-pager -n 80 || true
            podman stop "${POD}" || true
            exit 1
          fi

          # GNOME Shell only scans extension directories at startup, so the
          # extension must be installed before the session is started.
          echo "Installing extension package..."
          podman cp "${ZIP}" "${POD}:/home/gnomeshell/"
          run_in_pod gnome-extensions install --force "${UUID}.zip"

          echo "Starting GNOME Shell inside container display :99..."
          run_in_pod systemctl --user start "gnome-xsession@:99"
          sleep 8

          echo "Enabling extension..."
          run_in_pod gnome-extensions enable "${UUID}"
          sleep 4

          echo "Verifying extension status via D-Bus..."
          INFO=$(run_in_pod gdbus call --session \
            --dest org.gnome.Shell.Extensions \
            --object-path /org/gnome/Shell/Extensions \
            --method org.gnome.Shell.Extensions.GetExtensionInfo "${UUID}")

          echo "Extension Info: ${INFO}"

          # The state is returned as a double (<1.0>) on some shell versions and as uint32 on others
          if echo "${INFO}" | grep -Eq "'state': <(uint32 )?1(\.0)?>"; then
            echo "SUCCESS: Extension is ACTIVE in GNOME ${{ matrix.gnome-version }}!"
          else
            echo "ERROR: Extension failed to activate in GNOME ${{ matrix.gnome-version }}!"
            echo "=== Journal logs ==="
            run_in_pod journalctl --user -u "gnome-xsession@:99" --no-pager -n 80 || true
            podman stop "${POD}"
            exit 1
          fi

          podman stop "${POD}"
